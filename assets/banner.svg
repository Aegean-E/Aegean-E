<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">AegeanWorks</title>
  <desc id="desc">AegeanWorks — local-first AI, cognitive systems and computational research.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0B1526"/>
      <stop offset="1" stop-color="#111C36"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67E8F9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glowA)"/>
  <rect width="1200" height="340" fill="url(#glowB)"/>

  <g fill="none" stroke="url(#wave)" stroke-linecap="round">
    <path d="M -40 276 C 170 232, 280 320, 460 276 S 760 230, 940 274 S 1120 320, 1240 272" stroke-width="1.4" opacity="0.55"/>
    <path d="M -40 300 C 170 256, 280 344, 460 300 S 760 254, 940 298 S 1120 344, 1240 296" stroke-width="1.1" opacity="0.32"/>
    <path d="M -40 324 C 170 280, 280 368, 460 324 S 760 278, 940 322 S 1120 368, 1240 320" stroke-width="0.9" opacity="0.18"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="116" fill="#94A3B8" font-size="13" font-weight="600" letter-spacing="7">LOCAL-FIRST  ·  COGNITIVE SYSTEMS  ·  RESEARCH</text>
    <text x="600" y="186" fill="#F8FAFC" font-size="66" font-weight="800" letter-spacing="2">AEGEAN<tspan fill="#67E8F9">WORKS</tspan></text>
    <text x="600" y="224" fill="#CBD5E1" font-size="17" font-weight="400">Modular intelligence, built to think · remember · explain</text>
  </g>
</svg>
