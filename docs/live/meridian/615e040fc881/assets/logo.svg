<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Meridian logo</title>
  <desc id="desc">A teal meridian globe over a deep navy field, the mark of the Meridian time zone meeting planner by AegeanWorks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0a1b28"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#38d9c3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38d9c3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff0dd"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <g transform="translate(256 218)">
    <circle r="104" fill="none" stroke="url(#ink)" stroke-width="7"/>
    <ellipse rx="44" ry="104" fill="none" stroke="#38d9c3" stroke-width="3" stroke-opacity="0.55"/>
    <ellipse rx="78" ry="104" fill="none" stroke="#38d9c3" stroke-width="2" stroke-opacity="0.3"/>
    <ellipse rx="104" ry="44" fill="none" stroke="#38d9c3" stroke-width="3" stroke-opacity="0.45"/>
    <path d="M-104 0H104" stroke="url(#ink)" stroke-width="5"/>
    <circle r="16" fill="#7ff0dd"/>
    <circle r="34" fill="none" stroke="#7ff0dd" stroke-width="3" stroke-opacity="0.5"/>
  </g>

  <text x="256" y="382" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="9" fill="#e9eef8">MERIDIAN</text>
  <text x="256" y="424" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="7" fill="#38d9c3" fill-opacity="0.8">TIME ZONES</text>
  <text x="256" y="462" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="5" fill="#e9eef8" fill-opacity="0.4">AEGEANWORKS</text>
</svg>
