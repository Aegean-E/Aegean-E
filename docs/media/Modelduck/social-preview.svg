<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ModelDuck social preview</title>
  <desc id="desc">ModelDuck is a local GGUF chat studio featuring the friendly yellow ModelDuck mascot that tunes each model's settings on your own PC: CPU or GPU, speed, sampling and prompts per task. OpenAI-compatible API, no cloud account.</desc>
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="page-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e172a"/>
      <stop offset="0.5" stop-color="#0a101d"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="duck-glow" cx="0.2" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#ffd447" stop-opacity=".2"/>
      <stop offset="0.6" stop-color="#ffd447" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ffd447" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accent-glow" cx="0.85" cy="0.2" r="0.4">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Duck Badge Gradients -->
    <linearGradient id="duck-badge-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142038"/>
      <stop offset="1" stop-color="#080d17"/>
    </linearGradient>
    <linearGradient id="duck-body-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#f7c63d"/>
    </linearGradient>
    <linearGradient id="duck-beak-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb52e"/>
      <stop offset="1" stop-color="#f08a12"/>
    </linearGradient>
    <filter id="duck-shadow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="duck-badge-clip">
      <rect width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="640" fill="url(#page-bg)"/>
  <rect width="1280" height="640" fill="url(#duck-glow)"/>
  <rect width="1280" height="640" fill="url(#accent-glow)"/>

  <!-- Subtle Engineering Grid -->
  <g stroke="#ffffff" stroke-opacity=".04" stroke-width="1">
    <path d="M0 160H1280M0 320H1280M0 480H1280M320 0V640M640 0V640M960 0V640"/>
  </g>

  <!-- Left Side: Inlined ModelDuck Mascot Badge -->
  <g transform="translate(68, 148)">
    <!-- Soft Drop Shadow Under Badge -->
    <ellipse cx="172" cy="352" rx="150" ry="22" fill="#000000" opacity=".4" filter="url(#duck-shadow-blur)"/>

    <!-- Scaled Badge Container (344x344 from 512x512) -->
    <svg width="344" height="344" viewBox="0 0 512 512">
      <!-- Badge Base -->
      <rect width="512" height="512" rx="116" fill="url(#duck-badge-bg)" stroke="#ffffff" stroke-opacity=".1" stroke-width="4"/>
      
      <!-- Inner Ambient Highlights -->
      <g clip-path="url(#duck-badge-clip)">
        <circle cx="404" cy="92" r="118" fill="#ffd447" opacity=".09"/>
        <circle cx="96" cy="430" r="140" fill="#38bdf8" opacity=".06"/>
      </g>

      <!-- Duck Mascot Drop Shadow -->
      <ellipse cx="256" cy="430" rx="154" ry="26" fill="#000000" opacity=".3" filter="url(#duck-shadow-blur)"/>

      <!-- Duck Body & Breast -->
      <path d="M149 329c0-72 48-121 111-121 64 0 111 49 111 121v13c0 43-49 73-111 73s-111-30-111-73z" fill="url(#duck-body-grad)"/>
      <path d="M158 344c18 31 55 49 99 49 43 0 80-18 99-49 4 50-42 78-99 78s-103-28-99-78z" fill="#eeb92f" opacity=".55"/>

      <!-- Wing & Feather Highlight -->
      <path d="M170 305c-31 6-53 28-56 59 22 15 55 10 74-10 13-14 17-34 9-49z" fill="#eeb92f" opacity=".9"/>
      <path d="M176 314c-20 8-34 24-38 43 16 5 34-1 45-14 8-10 8-21 3-29z" fill="#f7d45c" opacity=".7"/>

      <!-- Tail Tuft Feather -->
      <path d="M245 109c-14-21 2-41 25-35 0 10 8 15 16 10 5 23-19 38-41 25z" fill="#f7c63d"/>

      <!-- Head & Outer Stroke -->
      <circle cx="269" cy="198" r="96" fill="url(#duck-body-grad)"/>
      <circle cx="269" cy="198" r="96" fill="none" stroke="#e7b52c" stroke-opacity=".35" stroke-width="4"/>

      <!-- Beak with Lower Lip and Highlight -->
      <path d="M346 193c44-10 81 6 85 28 4 21-27 39-69 33-14-2-24-11-26-23-2-16-1-28 10-38z" fill="url(#duck-beak-grad)"/>
      <path d="M352 222c27 8 56 8 77 2-9 12-31 20-53 18-14-2-23-9-24-20z" fill="#dc7b0b"/>
      <path d="M346 193c20-4 40-3 57 3-21 2-41 8-57 17z" fill="#ffd08a" opacity=".55"/>

      <!-- Expressive Eye & Catchlight -->
      <circle cx="307" cy="171" r="13" fill="#0b1220"/>
      <circle cx="311" cy="166" r="4.5" fill="#fffdf6"/>

      <!-- Warm Cheek Blush -->
      <circle cx="329" cy="220" r="13" fill="#ff9f1c" opacity=".35"/>

      <!-- Friendly Smile Line -->
      <path d="M207 286c34 20 89 20 124 0" fill="none" stroke="#0b1220" stroke-opacity=".12" stroke-width="12" stroke-linecap="round"/>

      <!-- Whimsical Sparkles / Stars -->
      <g fill="#ffe9a3">
        <path d="M105 150l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" opacity=".95"/>
        <path d="M399 326l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" opacity=".75"/>
        <circle cx="389" cy="121" r="5" opacity=".55"/>
      </g>
    </svg>
  </g>

  <!-- Right Side: Content & Typography -->
  <text x="460" y="244" fill="#ffffff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="78" font-weight="700">ModelDuck</text>
  <text x="464" y="292" fill="#ffd447" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="5">AEGEANWORKS · LOCAL AI CHAT STUDIO</text>
  <text fill="#d5dbe7" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="27">
    <tspan x="462" y="348">A local GGUF chat studio that tunes each model</tspan>
    <tspan x="462" y="386">on your own PC: CPU or GPU, speed, sampling and</tspan>
    <tspan x="462" y="424">prompts per task. OpenAI-compatible API, no cloud.</tspan>
  </text>

  <!-- Tag Pills -->
  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#e6ebf5">
    <!-- Tag 1 -->
    <rect x="462" y="468" width="152" height="38" rx="19" fill="#162238" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="482" cy="487" r="4.5" fill="#4ade80"/>
    <text x="496" y="493">runs locally</text>

    <!-- Tag 2 -->
    <rect x="628" y="468" width="168" height="38" rx="19" fill="#162238" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="648" cy="487" r="4.5" fill="#fbbf24"/>
    <text x="662" y="493">settings tuner</text>

    <!-- Tag 3 -->
    <rect x="810" y="468" width="154" height="38" rx="19" fill="#162238" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="830" cy="487" r="4.5" fill="#38bdf8"/>
    <text x="844" y="493">OpenAI API</text>
  </g>

  <!-- Footer Metadata -->
  <text x="76" y="592" fill="#8a96ad" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="6">AEGEANWORKS</text>
  <text x="1204" y="592" fill="#ffb52e" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="end">github.com/AegeanWorks/Modelduck</text>
</svg>