  <text x="80" y="378" font-family="Georgia, Times New Roman, serif" font-size="29" fill="#F8FAFC" fill-opacity="0.74">A tiny systems language built for AI agents: one</text><text x="80" y="420" font-family="Georgia, Times New Roman, serif" font-size="29" fill="#F8FAFC" fill-opacity="0.74">obvious syntax, machine-readable diagnostics,</text><text x="80" y="462" font-family="Georgia, Times New Roman, serif" font-size="29" fill="#F8FAFC" fill-opacity="0.74">deterministic builds, and its own x86-64 backend.</text>
