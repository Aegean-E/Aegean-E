      <path d="M0 88C12 80 24 96 36 88C48 80 60 96 72 88C84 80 96 96 108 88" fill="none" stroke="#f472b6" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="panelClip">
      <rect width="316" height="376" rx="26"/>
    </clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#field)"/>
  <rect width="1280" height="640" fill="url(#weave)"/>
  <rect width="1280" height="640" fill="url(#washCyan)"/>
  <rect width="1280" height="640" fill="url(#washViolet)"/>
