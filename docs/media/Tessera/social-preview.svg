<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Tessera social preview</title>
  <desc id="desc">Tessera, a seamless pattern studio: compose geometric tiles in the browser and export crisp SVG.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="0.55" stop-color="#05070d"/>
      <stop offset="1" stop-color="#080b16"/>
    </linearGradient>
    <radialGradient id="washCyan" cx="0.12" cy="0.08" r="0.62">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washViolet" cx="0.86" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
