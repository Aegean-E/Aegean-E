  <text x="96" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#e6edf7">A tile that never ends.</text>
  <text x="96" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#b6c4d8">Compose seamless geometric patterns in the browser,</text>
  <text x="96" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#b6c4d8">tune every line, and export crisp editable SVG.</text>
