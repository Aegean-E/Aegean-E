name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the regression suite
        run: python -m unittest discover -s tests -v
      - name: Run the browser-verifier parity suite
        run: node tests/verify/run-tests.mjs
      - name: Run the live-atlas parity suite
        run: node tests/atlas/run-tests.mjs
      - name: Run the project-dossier parity suite
        run: node tests/project/run-tests.mjs
      - name: Run the live catalog suite
        run: node tests/live/run-tests.mjs
      - name: Verify dossier media manifests and digests
        run: python tools/build_dossier_media.py check
