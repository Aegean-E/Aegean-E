name: playable

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/sync_playable_games.py"

permissions:
  contents: write

concurrency:
  group: playable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
      - name: Check out Prism-Relay
        uses: actions/checkout@v4
        with:
          repository: AegeanWorks/Prism-Relay
          path: .play-src/prism-relay
          fetch-depth: 1
      - name: Check out Weft
        uses: actions/checkout@v4
        with:
          repository: AegeanWorks/Weft
          path: .play-src/weft
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the browser game contract
        run: python tools/sync_playable_games.py --source-root .play-src --check-source
      - name: Refresh the playable builds
        run: python tools/sync_playable_games.py --source-root .play-src --write
      - name: Verify the playable catalog
        run: python tools/sync_playable_games.py --check
      - name: Commit when a game changed
        run: |
          if [ -n "$(git status --porcelain docs/play docs/playable.json LICENSES/LicenseRef-AGL-1.1.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/play docs/playable.json LICENSES/LicenseRef-AGL-1.1.txt
            git commit -m "chore(play): refresh browser game builds"
            git push
          else
            echo "Playable games are already current."
          fi
