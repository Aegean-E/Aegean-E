name: live

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/sync_live_apps.py"

permissions:
  contents: write

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
      - name: Check out Prism-Relay
        uses: actions/checkout@v4
        with:
          repository: AegeanWorks/Prism-Relay
          path: .app-src/prism-relay
          fetch-depth: 1
      - name: Check out Weft
        uses: actions/checkout@v4
        with:
          repository: AegeanWorks/Weft
          path: .app-src/weft
          fetch-depth: 1
      - name: Check out Tessera
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: AegeanWorks/Tessera
          path: .app-src/tessera
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the live app contract
        run: python tools/sync_live_apps.py --source-root .app-src --check-source
      - name: Refresh the live app builds
        run: python tools/sync_live_apps.py --source-root .app-src --write
      - name: Verify the live app catalog
        run: python tools/sync_live_apps.py --check
      - name: Commit when an app changed
        run: |
          if [ -n "$(git status --porcelain docs/live docs/live.json LICENSES/LicenseRef-AGL-1.1.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/live docs/live.json LICENSES/LicenseRef-AGL-1.1.txt
            git commit -m "chore(live): refresh browser app builds"
            git push
          else
            echo "Live apps are already current."
          fi
